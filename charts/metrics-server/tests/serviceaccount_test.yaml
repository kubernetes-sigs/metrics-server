# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: ServiceAccount
templates:
  - templates/serviceaccount.yaml
release:
  name: ms
  namespace: kube-system
chart:
  version: 0.0.0-test
  appVersion: 1.2.3
tests:
  - it: renders a ServiceAccount with the default values
    asserts:
      - hasDocuments:
          count: 1
      - matchSnapshot: {}

  - it: is not rendered when serviceAccount.create is false
    set:
      serviceAccount:
        create: false
    asserts:
      - hasDocuments:
          count: 0

  - it: uses serviceAccount.name when set
    set:
      serviceAccount:
        name: custom-sa
    asserts:
      - equal:
          path: metadata.name
          value: custom-sa

  - it: uses fullnameOverride for the generated name
    set:
      fullnameOverride: my-metrics
    asserts:
      - equal:
          path: metadata.name
          value: my-metrics

  - it: uses namespaceOverride
    set:
      namespaceOverride: monitoring
    asserts:
      - equal:
          path: metadata.namespace
          value: monitoring

  - it: adds commonLabels
    set:
      commonLabels:
        team: platform
    asserts:
      - equal:
          path: metadata.labels.team
          value: platform

  - it: renders serviceAccount.annotations
    set:
      serviceAccount:
        annotations:
          example.com/owner: platform
    asserts:
      - equal:
          path: metadata.annotations
          value:
            example.com/owner: platform

  - it: renders serviceAccount.secrets
    set:
      serviceAccount:
        secrets:
          - name: token-a
          - name: token-b
    asserts:
      - equal:
          path: secrets
          value:
            - name: token-a
            - name: token-b
