apiVersion: v2
name: metrics-server
description: Metrics Server is a scalable, efficient source of container resource metrics for Kubernetes built-in autoscaling pipelines.
type: application
version: 3.15.0
appVersion: 0.9.1
keywords:
  - kubernetes
  - metrics-server
  - metrics
home: https://github.com/kubernetes-sigs/metrics-server
icon: https://avatars.githubusercontent.com/u/36015203?s=400&v=4
sources:
  - https://github.com/kubernetes-sigs/metrics-server
maintainers:
  - name: stevehipwell
    url: https://github.com/stevehipwell
  - name: krmichel
    url: https://github.com/krmichel
  - name: endrec
    url: https://github.com/endrec
annotations:
  artifacthub.io/changes: |
    - kind: added
      description: "Add `tls.certManager.existingIssuer.group` for custom cert-manager issuer groups when `tls.certManager.existingIssuer.enabled` is `true`"
    - kind: added
      description: "Add `apiService.v1.create` and `apiService.v1beta1.create` to control the creation of each APIService version independently."
    - kind: changed
      description: "Update the _Metrics Server_ OCI image to [`0.9.1`](https://github.com/kubernetes-sigs/metrics-server/releases/tag/v0.9.1)."
    - kind: security
      description: "Rebuild release image to drop the distrusted eMudhra roots from the CA bundle."
    - kind: security
      description: "Bump Go to v1.26.10."      
